name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El repo no tiene gradlew/gradle-wrapper.jar: se instala Gradle (misma versión que gradle-wrapper.properties)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Archivos que no están en el repo (ver .gitignore)
      - name: Crear google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Validar google-services.json
        run: python3 -m json.tool app/google-services.json > /dev/null || (echo "El secret GOOGLE_SERVICES_JSON está incompleto o mal codificado" && exit 1)

      - name: Crear local.properties
        run: |
          {
            echo "ECOGPT_API_KEY=${{ secrets.ECOGPT_API_KEY }}"
            echo "ECOGPT_BASE_URL=${{ secrets.ECOGPT_BASE_URL }}"
            echo "ECOGPT_MODO_DEMO=false"
          } > local.properties

      # Keystore de debug fijo: misma firma (SHA-1) en cada build, la que está registrada en Firebase.
      # Sin esto el runner genera una clave nueva y el login con Google falla.
      - name: Instalar debug.keystore
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ecosmart-debug-apk
          path: app/build/outputs/apk/debug/*.apk
