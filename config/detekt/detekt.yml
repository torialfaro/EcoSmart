# Config mínima de detekt (T004) — se apoya en buildUponDefaultConfig (app/build.gradle.kts),
# acá solo se ajustan los umbrales que chocan con las convenciones de EcoSmart
# (ver constitution.md, Principio V: métodos < ~40 líneas).

complexity:
  LongMethod:
    threshold: 40
    ignoreAnnotated: ['Composable'] # los @Composable de UI declaran árboles largos
  LongParameterList:
    functionThreshold: 6
    constructorThreshold: 8
    ignoreAnnotated: ['Composable'] # los @Composable reciben callbacks y modifier por convención
  TooManyFunctions:
    thresholdInClasses: 15

style:
  ForbiddenComment:
    active: false # se usa TODO/FIXME normalmente durante /speckit.implement
  MagicNumber:
    active: false # 133 pasos, 3km, 30s, umbrales de nivel, etc. son constantes de negocio, no "mágicas"
  MaxLineLength:
    maxLineLength: 140 # igual que ktlint (.editorconfig)

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable'] # los @Composable se nombran en PascalCase
  ClassNaming:
    active: true
