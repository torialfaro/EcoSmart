[versions]
# Ver plan.md § Technical Context y research.md. Versiones pineadas a la
# fecha de este plan (2026-09-20); Android Studio puede sugerir bumps al
# abrir el proyecto — actualizar acá, no en los build.gradle.kts.
agp = "8.6.0"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"

coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.02"
navigationCompose = "2.8.0"

hilt = "2.52"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"

room = "2.6.1"

retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"

workManager = "2.9.1"

cameraX = "1.3.4"
playServicesLocation = "21.3.0"
osmdroid = "6.1.20"

nimbusJoseJwt = "9.40"
securityCrypto = "1.1.0-alpha06"

junit5 = "5.11.0"
mockk = "1.13.12"
turbine = "1.1.0"
